<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120805">
<meta name="description" content="Jadwal shift harian dan bulanan Fantastic 4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jadwal F4">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Jadwal Fantastic 4</title>
<style>
:root{color-scheme:dark;--bg:#120805;--panel:#1e0f09;--ink:#fff1e0;--sub:#c9a08a;--line:#4a2013;--accent:#ff5a00;--glow:#ffb300;--pagi:#ffc233;--siang:#3fd0c0;--malam:#b58cff;--cuti:#7bdc6a;--off:#8a6f63;--shadow:0 0 0 1px rgba(255,90,0,.12),0 8px 28px rgba(255,60,0,.14)}
:root[data-theme=light]{color-scheme:light;--bg:#fff1e0;--panel:#fff;--ink:#2a0f06;--sub:#7a5546;--line:#f1d2b8;--accent:#d93a00;--glow:#b45309;--pagi:#b7791f;--siang:#0f8f86;--malam:#6d3fd0;--cuti:#2b8a3e;--off:#8a766b;--shadow:0 1px 2px rgba(42,15,6,.08),0 6px 18px rgba(217,58,0,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,select,input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding:18px 20px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.brand{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.brand h1{font-size:21px;margin:0;letter-spacing:-.02em;font-weight:800}
.range{color:var(--sub);font-size:13px;margin-left:auto}
.sync{color:var(--sub);font-size:12px;margin-top:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--off);margin-right:6px}
.online .dot{background:var(--siang);box-shadow:0 0 0 3px color-mix(in srgb,var(--siang) 25%,transparent)}
.denied .dot{background:#e5484d}
.offline .dot{background:var(--pagi)}
.tabs{display:flex;gap:4px;margin-top:14px}
.tabs button{padding:10px 16px;border:0;border-bottom:3px solid transparent;background:none;color:var(--sub);cursor:pointer;font-weight:600}
.tabs button.active{color:var(--accent);border-color:var(--accent)}
main{padding:20px;max-width:1400px;margin:auto}
.view{display:none}.view.active{display:block}
.nav{display:flex;gap:10px;align-items:center;margin-bottom:20px}
.nav button,select,input{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:9px 12px}
.nav select{flex:1;max-width:300px}
.nav button{font-size:18px;width:40px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.hero{font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:20px;padding-left:14px;border-left:5px solid var(--accent)}
.sub{font-size:14px;color:var(--sub);font-weight:500;letter-spacing:0;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
.stat,.team{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stat{border-top:4px solid var(--off)}
.stat b{font-size:28px;line-height:1}
.stat small{display:block;color:var(--sub);margin-top:6px;font-weight:600}
.pagi{--c:var(--pagi)}.siang{--c:var(--siang)}.malam{--c:var(--malam)}.cuti{--c:var(--cuti)}.off{--c:var(--off)}
.stat.pagi,.stat.siang,.stat.malam,.stat.cuti,.stat.off{border-top-color:var(--c)}
.stat b{color:var(--c,var(--ink))}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.team h3{font-size:15px;margin:0 0 8px;font-weight:700}
.person{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
.person span:first-child{font-weight:600;min-width:90px}
.badge{display:inline-block;padding:4px 10px;border-radius:7px;font-weight:700;font-size:13px;color:var(--c,var(--sub));background:color-mix(in srgb,var(--c,var(--off)) 15%,transparent)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
.controls button{border:1px solid var(--line);border-radius:20px;padding:7px 14px;background:var(--panel);color:var(--ink);cursor:pointer;margin:0 6px 6px 0}
.controls button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.search{margin-left:auto}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;min-width:100%}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);min-width:130px;padding-left:12px}
th{color:var(--sub);font-size:12px;font-weight:600}
.teamrow td{font-weight:700;background:color-mix(in srgb,var(--accent) 10%,var(--panel))!important;color:var(--accent)}
.empty{text-align:center;color:var(--sub);padding:35px}
footer{padding:10px 20px 30px;color:var(--sub);font-size:12px}
.icon,.install{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:8px 12px;font-size:13px;cursor:pointer}
.icon{font-size:16px;line-height:1;padding:8px 11px}
.install[hidden]{display:none}
header{padding-top:calc(18px + env(safe-area-inset-top))}
main{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
footer{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:span 2}.range{margin-left:0;width:100%;order:5}.search{margin-left:0;width:100%}.search input{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
header{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 22%,var(--bg)),var(--bg));border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.brand h1{font-weight:800;letter-spacing:.01em}
.brand h1::before{content:"";display:inline-block;width:24px;height:24px;margin-right:10px;vertical-align:-4px;border-radius:50%;background:radial-gradient(ellipse 13% 58% at 50% 50%,#000 94%,transparent 100%),radial-gradient(circle,#ffd24a 0,#ff6a00 55%,#d12600 100%);box-shadow:0 0 0 2px #000,0 0 16px 3px rgba(255,90,0,.7)}
.online .dot{background:var(--siang);box-shadow:0 0 0 3px color-mix(in srgb,var(--siang) 30%,transparent),0 0 10px var(--siang)}
.hero{border-left-color:var(--accent);text-shadow:0 0 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.stat{background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--off)) 10%,var(--panel)),var(--panel))}
.stat b{text-shadow:0 0 14px color-mix(in srgb,var(--c,var(--off)) 45%,transparent)}
.team{border-left:3px solid color-mix(in srgb,var(--accent) 70%,transparent)}
.team h3{color:var(--glow)}
.controls button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--accent) 50%,transparent)}
.teamrow td{color:var(--glow)}
.tabs button.active{color:var(--ink)}
</style>
</head>
<body>
<header><div class="brand"><h1>Jadwal Fantastic 4</h1><button class="icon" id="theme" aria-label="Ganti tema">☾</button><button class="install" id="install" hidden>Pasang aplikasi</button><span class="range" id="range">Memuat data…</span></div><div class="sync" id="sync"><span class="dot"></span><span id="syncText">Menyambungkan ke spreadsheet…</span></div><div class="tabs"><button class="active" id="dashTab">Dasbor Harian</button><button id="tableTab">Tabel Bulanan</button></div></header>
<main><section class="view active" id="dash"><div class="nav"><button id="prev">‹</button><select id="day"></select><button id="next">›</button></div><div class="hero"><div id="heroDate"></div><div class="sub" id="heroSub"></div></div><div class="stats" id="stats"></div><div class="teams" id="teams"></div></section><section class="view" id="table"><div class="controls"><div id="teamButtons"></div><div class="search"><input id="search" placeholder="Cari nama…"></div></div><div class="scroll"><table><thead><tr id="headDates"></tr><tr id="headDays"></tr></thead><tbody id="body"></tbody></table></div><div class="empty" id="empty" hidden>Tidak ada nama yang cocok.</div></section></main><footer>Kode shift — CF 06:00–14:00 · CG 07:00–15:00 · EF 06:00–12:00 · EG 07:00–13:00 · CK 11:00–19:00 · CL 12:00–20:00 · DN 14:30–22:30 · FP 16:30–22:30 · AL cuti · X libur</footer>
<script>
const DATA={dates:[],days:[],teams:{}};const KEY='2PACX-1vTuv0DHS_mAjL1WVEmNtH1DouA6AZe5cmd9is5C9vlDuy2uNrv_0W9i87q8ra6u5xOx8RTbqZ6Rf_Oc';const CSV=`https://docs.google.com/spreadsheets/d/e/${KEY}/pub?output=csv`;const INFO={CF:['pagi','06:00–14:00'],CG:['pagi','07:00–15:00'],EF:['pagi','06:00–12:00'],EG:['pagi','07:00–13:00'],CK:['siang','11:00–19:00'],CL:['siang','12:00–20:00'],DN:['malam','14:30–22:30'],FP:['malam','16:30–22:30'],AL:['cuti','Cuti'],X:['off','Libur']};const LABEL={pagi:'Pagi',siang:'Siang',malam:'Malam',cuti:'Cuti',off:'Libur'};const ORDER=['pagi','siang','malam','cuti','off'];const FULL={SENIN:'Senin',SELASA:'Selasa',RABU:'Rabu',KAMIS:'Kamis',JUMAT:'Jumat',SABTU:'Sabtu',MINGGU:'Minggu'};const DAYS=Object.keys(FULL);let index=0,active='ALL';
function csv(text){let out=[],r=[],f='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;r.push(f);if(r.some(x=>x.trim()))out.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);out.push(r)}return out}
function isDayRow(a){return a.some(x=>DAYS.includes(String(x).trim().toUpperCase()))}
function parse(rows){let dates=null,days=null,teams={},team=null;for(const raw of rows){const a=raw.map(x=>(x||'').trim()),first=a[0]||'',vals=a.filter(Boolean);if(!vals.length)continue;if(/^TIM\s/i.test(first)){team=first;teams[team]={};continue}if(team&&/^NAMA$/i.test(first)){if(!dates)dates=a.slice(1);else if(!days&&isDayRow(a))days=a.slice(1);continue}if(team&&first&&!/^KODE SHIFT$/i.test(first)&&!/^WAKTU$/i.test(first)&&first!=='NAMA')teams[team][first]=a.slice(1)}if(!dates)return null;let n=dates.length;while(n&&dates[n-1]==='')n--;dates=dates.slice(0,n);if(!days||days.length!==n){days=Array(n).fill('');}days=days.slice(0,n).map((x,i)=>{let v=String(x||'').trim().toUpperCase();return DAYS.includes(v)?v:''});Object.values(teams).forEach(p=>Object.keys(p).forEach(k=>{p[k]=p[k].slice(0,n);while(p[k].length<n)p[k].push('')}));return{dates,days,teams}}
function ok(){return DATA.dates.length&&Object.keys(DATA.teams).length}
function findTodayIndex(){if(!ok())return 0;let d=new Date(),day=String(d.getDate()),mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];return DATA.dates.findIndex(x=>{let s=String(x).replace(/^0/,'');return s.includes(day+'-')&&s.toLowerCase().includes(mon.toLowerCase())})>=0?DATA.dates.findIndex(x=>{let s=String(x).replace(/^0/,'');return s.includes(day+'-')&&s.toLowerCase().includes(mon.toLowerCase())}):0}
function render(){if(!ok())return;document.getElementById('range').textContent=DATA.dates[0]+' — '+DATA.dates.at(-1);const sel=document.getElementById('day');sel.innerHTML='';DATA.dates.forEach((d,i)=>{let o=document.createElement('option');o.value=i;o.textContent=DATA.days[i]?FULL[DATA.days[i]]+', '+d:d;sel.append(o)});document.getElementById('heroDate').textContent=DATA.days[index]?FULL[DATA.days[index]]+', '+DATA.dates[index]:DATA.dates[index];document.getElementById('heroSub').textContent=['SABTU','MINGGU'].includes(DATA.days[index])?'Akhir pekan':'Hari kerja';sel.value=index;document.getElementById('prev').disabled=!index;document.getElementById('next').disabled=index===DATA.dates.length-1;let count={pagi:0,siang:0,malam:0,cuti:0,off:0};Object.values(DATA.teams).forEach(p=>Object.values(p).forEach(s=>{let x=INFO[s[index]];if(x)count[x[0]]++}));document.getElementById('stats').innerHTML=ORDER.map(g=>`<div class="stat ${g}"><b>${count[g]}</b><small>${LABEL[g]}</small></div>`).join('');document.getElementById('teams').innerHTML=Object.entries(DATA.teams).map(([t,p])=>`<div class="team"><h3>${t}</h3>${Object.entries(p).map(([name,s])=>{let x=INFO[s[index]];return x?`<div class="person"><span>${name}</span><span class="badge ${x[0]}">${s[index]}</span><span class="sub">${x[1]}</span></div>`:''}).join('')}</div>`).join('');renderTable()}
function renderTable(){document.getElementById('teamButtons').innerHTML=['ALL',...Object.keys(DATA.teams)].map(x=>`<button class="${x===active?'active':''}" data-team="${x}">${x==='ALL'?'Semua Tim':x}</button>`).join('');document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{active=b.dataset.team;renderTable()});document.getElementById('headDates').innerHTML='<th>Nama</th>'+DATA.dates.map(x=>`<th>${x}</th>`).join('');document.getElementById('headDays').innerHTML='<th></th>'+DATA.days.map(x=>`<th>${x?x.slice(0,3):''}</th>`).join('');let q=document.getElementById('search').value.toUpperCase(),html='',shown=0;Object.entries(DATA.teams).forEach(([t,p])=>{if(active!=='ALL'&&active!==t)return;let people=Object.entries(p).filter(([n])=>!q||n.toUpperCase().includes(q));if(!people.length)return;html+=`<tr class="teamrow"><td>${t}</td>${DATA.dates.map(()=>'<td></td>').join('')}</tr>`;people.forEach(([n,s])=>{shown++;html+=`<tr><td>${n}</td>`+s.map(x=>{let i=INFO[x];return `<td><span class="badge ${i?i[0]:''}">${x||'–'}</span></td>`}).join('')+'</tr>'})});document.getElementById('body').innerHTML=html;document.getElementById('empty').hidden=shown>0}
async function sync(){try{let r=await fetch(CSV+'&v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let p=parse(csv(await r.text()));if(!p)throw Error('format');Object.assign(DATA,p);index=findTodayIndex();render();const cached=r.headers.get('X-From-Cache')==='1';document.getElementById('sync').className=cached?'sync offline':'sync online';document.getElementById('syncText').textContent=cached?'Offline — menampilkan data terakhir yang tersimpan':'Tersambung ke spreadsheet'}catch(e){document.getElementById('sync').className='sync denied';document.getElementById('syncText').textContent='Gagal membaca spreadsheet: '+e.message}}
document.getElementById('prev').onclick=()=>{if(index){index--;render()}};document.getElementById('next').onclick=()=>{if(index<DATA.dates.length-1){index++;render()}};document.getElementById('day').onchange=e=>{index=+e.target.value;render()};document.getElementById('search').oninput=renderTable;document.getElementById('dashTab').onclick=()=>{dashTab.classList.add('active');tableTab.classList.remove('active');dash.classList.add('active');table.classList.remove('active')};document.getElementById('tableTab').onclick=()=>{tableTab.classList.add('active');dashTab.classList.remove('active');table.classList.add('active');dash.classList.remove('active')};sync();setInterval(sync,60000);
let deferredPrompt=null;const installBtn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true};window.addEventListener('appinstalled',()=>{installBtn.hidden=true});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
window.addEventListener('online',sync);
const themeBtn=document.getElementById('theme'),themeMeta=document.querySelector('meta[name=theme-color]'),darkMQ=matchMedia('(prefers-color-scheme:dark)');
function applyTheme(){const t=document.documentElement.dataset.theme,dark=t?t==='dark':true;themeMeta.content=dark?'#120805':'#fff1e0';themeBtn.textContent=dark?'☀':'☾'}
try{const s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s}catch(e){}
themeBtn.onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':true,n=dark?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}applyTheme()};
applyTheme();
</script></body></html>
