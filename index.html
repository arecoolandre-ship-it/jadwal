<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Jadwal Fantastic 4</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#181a1e;--sub:#6b6a63;--line:#e2dfd5;--accent:#b8391e;--pagi:#b8791a;--siang:#1e7a72;--malam:#3e4c8a;--cuti:#3d7a3f;--off:#8f8b80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}header{padding:18px 20px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}.brand{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand h1{font-size:22px;margin:0}.range{color:var(--sub);font-size:13px}.sync{color:var(--sub);font-size:12px;margin-top:7px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--off);margin-right:6px}.online .dot{background:var(--siang)}.denied .dot{background:var(--accent)}.tabs{display:flex;gap:4px;margin-top:15px}.tabs button{padding:10px 16px;border:0;border-bottom:2px solid transparent;background:none;color:var(--sub);cursor:pointer}.tabs button.active{color:var(--ink);border-color:var(--accent)}main{padding:20px;max-width:1400px;margin:auto}.view{display:none}.view.active{display:block}.nav{display:flex;gap:10px;align-items:center;margin-bottom:20px}.nav button,select,input{border:1px solid #cfcbbd;border-radius:9px;background:var(--panel);color:var(--ink);padding:9px 12px}.nav button{font-size:18px;width:38px}.nav button:disabled{opacity:.35}.hero{font-size:clamp(28px,5vw,42px);font-weight:bold;margin-bottom:18px}.sub{font-size:14px;color:var(--sub);font-weight:normal;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}.stat,.team{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{font-size:25px}.stat small{display:block;color:var(--sub);margin-top:6px}.pagi b{color:var(--pagi)}.siang b{color:var(--siang)}.malam b{color:var(--malam)}.cuti b{color:var(--cuti)}.off b{color:var(--off)}.teams{display:flex;flex-direction:column;gap:12px}.team h3{font-size:15px;margin:0 0 10px}.person{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.person:first-of-type{border-top:0}.person span:first-child{font-weight:bold;min-width:90px}.badge{padding:4px 9px;border-radius:6px;font-weight:bold}.badge.pagi{background:#fbf0de;color:var(--pagi)}.badge.siang{background:#e2f4f1;color:var(--siang)}.badge.malam{background:#e7e9f7;color:var(--malam)}.badge.cuti{background:#e5f3e4;color:var(--cuti)}.badge.off{background:#f1efe8;color:var(--off)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.controls button{border:1px solid #cfcbbd;border-radius:20px;padding:7px 13px;background:var(--panel);color:var(--ink)}.controls button.active{background:var(--ink);color:var(--bg)}.search{margin-left:auto}.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}table{border-collapse:collapse;min-width:100%}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);min-width:130px}th{color:var(--sub);font-size:12px}.teamrow td{font-weight:bold;background:var(--bg)!important}.empty{text-align:center;color:var(--sub);padding:35px}footer{padding:10px 20px 30px;color:var(--sub);font-size:12px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.search{margin-left:0;width:100%}.search input{width:100%}}
</style>
</head>
<body>
<header><div class="brand"><h1>Jadwal Fantastic 4</h1><span class="range" id="range">Memuat data…</span></div><div class="sync" id="sync"><span class="dot"></span><span id="syncText">Menyambungkan ke spreadsheet…</span></div><div class="tabs"><button class="active" id="dashTab">Dasbor Harian</button><button id="tableTab">Tabel Bulanan</button></div></header>
<main><section class="view active" id="dash"><div class="nav"><button id="prev">‹</button><select id="day"></select><button id="next">›</button></div><div class="hero"><div id="heroDate"></div><div class="sub" id="heroSub"></div></div><div class="stats" id="stats"></div><div class="teams" id="teams"></div></section><section class="view" id="table"><div class="controls"><div id="teamButtons"></div><div class="search"><input id="search" placeholder="Cari nama…"></div></div><div class="scroll"><table><thead><tr id="headDates"></tr><tr id="headDays"></tr></thead><tbody id="body"></tbody></table></div><div class="empty" id="empty" hidden>Tidak ada nama yang cocok.</div></section></main><footer>Kode shift — CF 06:00–14:00 · CG 07:00–15:00 · EF 06:00–12:00 · EG 07:00–13:00 · CK 11:00–19:00 · CL 12:00–20:00 · DN 14:30–22:30 · FP 16:30–22:30 · AL cuti · X libur</footer>
<script>
const DATA={dates:[],days:[],teams:{}};const KEY='2PACX-1vTuv0DHS_mAjL1WVEmNtH1DouA6AZe5cmd9is5C9vlDuy2uNrv_0W9i87q8ra6u5xOx8RTbqZ6Rf_Oc';const CSV=`https://docs.google.com/spreadsheets/d/e/${KEY}/pub?output=csv`;const INFO={CF:['pagi','06:00–14:00'],CG:['pagi','07:00–15:00'],EF:['pagi','06:00–12:00'],EG:['pagi','07:00–13:00'],CK:['siang','11:00–19:00'],CL:['siang','12:00–20:00'],DN:['malam','14:30–22:30'],FP:['malam','16:30–22:30'],AL:['cuti','Cuti'],X:['off','Libur']};const LABEL={pagi:'Pagi',siang:'Siang',malam:'Malam',cuti:'Cuti',off:'Libur'};const ORDER=['pagi','siang','malam','cuti','off'];const FULL={SENIN:'Senin',SELASA:'Selasa',RABU:'Rabu',KAMIS:'Kamis',JUMAT:'Jumat',SABTU:'Sabtu',MINGGU:'Minggu'};let index=0,active='ALL';
function csv(text){let out=[],r=[],f='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;r.push(f);if(r.some(x=>x.trim()))out.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);out.push(r)}return out}
function parse(rows){let dates=null,days=null,teams={},team=null;for(const raw of rows){const a=raw.map(x=>(x||'').trim()),first=a[0]||'', vals=a.filter(Boolean);if(!vals.length)continue;if(/^TIM\s/i.test(first)){team=first;teams[team]={};continue}if(team&&/^NAMA$/i.test(first)){if(!dates)dates=a.slice(1);else if(!days)days=a.slice(1);continue}if(team&&first&&!/^KODE SHIFT$/i.test(first)&&!/^WAKTU$/i.test(first)&&first!=='NAMA')teams[team][first]=a.slice(1)}if(!dates||!days)return null;let n=dates.length;while(n&&dates[n-1]==='')n--;dates=dates.slice(0,n);days=days.slice(0,n);Object.values(teams).forEach(p=>Object.keys(p).forEach(k=>{p[k]=p[k].slice(0,n);while(p[k].length<n)p[k].push('')}));return{dates,days,teams}}
function ok(){return DATA.dates.length&&Object.keys(DATA.teams).length}
function findTodayIndex(){if(!ok())return 0;const today=new Date();const day=String(today.getDate()).padStart(2,'0');const month=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][today.getMonth()];const dateStr=day+'-'+month;for(let i=0;i<DATA.dates.length;i++){if(DATA.dates[i].includes(day)&&DATA.dates[i].includes(month))return i}return 0}
function render(){if(!ok())return;index=findTodayIndex();document.getElementById('range').textContent=DATA.dates[0]+' — '+DATA.dates.at(-1);const sel=document.getElementById('day');sel.innerHTML='';DATA.dates.forEach((d,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(FULL[DATA.days[i]]||DATA.days[i])+', '+d;sel.append(o)});sel.value=index;document.getElementById('heroDate').textContent=(FULL[DATA.days[index]]||DATA.days[index])+', '+DATA.dates[index];document.getElementById('heroSub').textContent=['SABTU','MINGGU'].includes(DATA.days[index])?'Akhir pekan':'Hari kerja';document.getElementById('prev').disabled=!index;document.getElementById('next').disabled=index===DATA.dates.length-1;let count={pagi:0,siang:0,malam:0,cuti:0,off:0};Object.values(DATA.teams).forEach(p=>Object.values(p).forEach(s=>{let x=INFO[s[index]];if(x)count[x[0]]++}));document.getElementById('stats').innerHTML=ORDER.map(g=>`<div class="stat ${g}"><b>${count[g]}</b><small>${LABEL[g]}</small></div>`).join('');document.getElementById('teams').innerHTML=Object.entries(DATA.teams).map(([t,p])=>{let rows=Object.entries(p).map(([name,s])=>{let x=INFO[s[index]];return x?`<div class="person"><span>${name}</span><span class="badge ${x[0]}">${s[index]}</span><span class="sub">${x[1]}</span></div>`:''}).join('');return `<div class="team"><h3>${t}</h3>${rows}</div>`}).join('');renderTable()}
function renderTable(){let buttons=['ALL',...Object.keys(DATA.teams)];document.getElementById('teamButtons').innerHTML=buttons.map(x=>`<button class="${x===active?'active':''}" data-team="${x}">${x==='ALL'?'Semua Tim':x}</button>`).join('');document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{active=b.dataset.team;renderTable()});document.getElementById('headDates').innerHTML='<th>Nama</th>'+DATA.dates.map(x=>`<th>${x}</th>`).join('');document.getElementById('headDays').innerHTML='<th></th>'+DATA.days.map(x=>`<th>${x.slice(0,3)}</th>`).join('');let q=document.getElementById('search').value.toUpperCase(),html='',shown=0;Object.entries(DATA.teams).forEach(([t,p])=>{if(active!=='ALL'&&active!==t)return;let people=Object.entries(p).filter(([n])=>!q||n.toUpperCase().includes(q));if(!people.length)return;html+=`<tr class="teamrow"><td>${t}</td>${DATA.dates.map(()=>'<td></td>').join('')}</tr>`;people.forEach(([n,s])=>{shown++;html+=`<tr><td>${n}</td>`+s.map(x=>{let i=INFO[x];return `<td><span class="badge ${i?i[0]:''}">${x||'–'}</span></td>`}).join('')+'</tr>'})});document.getElementById('body').innerHTML=html;document.getElementById('empty').hidden=shown>0}
async function sync(){try{let r=await fetch(CSV+'&v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let p=parse(csv(await r.text()));if(!p)throw Error('format');Object.assign(DATA,p);render();document.getElementById('sync').className='sync online';document.getElementById('syncText').textContent='Tersambung ke spreadsheet'}catch(e){document.getElementById('sync').className='sync denied';document.getElementById('syncText').textContent='Gagal membaca spreadsheet: '+e.message}}
document.getElementById('prev').onclick=()=>{if(index){index--;render()}};document.getElementById('next').onclick=()=>{if(index<DATA.dates.length-1){index++;render()}};document.getElementById('day').onchange=e=>{index=+e.target.value;render()};document.getElementById('search').oninput=renderTable;document.getElementById('dashTab').onclick=()=>{dashTab.classList.add('active');tableTab.classList.remove('active');dash.classList.add('active');table.classList.remove('active')};document.getElementById('tableTab').onclick=()=>{tableTab.classList.add('active');dashTab.classList.remove('active');table.classList.add('active');dash.classList.remove('active')};sync();setInterval(sync,60000);
</script></body></html>
